name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck and test (${{ matrix.os }}, Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test the built CLI
        run: npm run test:dist
      - name: Build and check the Chrome extension
        run: npm run test:extension

  oldest-node:
    name: Built CLI on the oldest supported Node (22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test with fake CLIs
        run: sh test/smoke.sh

  package:
    name: Package contents (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Install the packed tarball globally and run it
        run: |
          npm pack
          npm install -g ./battler-*.tgz
          PATH="$PWD/test/fixtures/bin:$PATH" battler --doctor
      - name: Run it with npx, without installing
        run: |
          npm uninstall -g battler
          PATH="$PWD/test/fixtures/bin:$PATH" npx --yes ./battler-*.tgz --doctor
