name: Release

# Push a tag like v0.2.0 to publish that version to npm.
# Uses npm trusted publishing (OIDC): no token is stored. One-time setup after the first manual
# `npm publish`: npmjs.com → battler → Settings → Trusted publishing → GitHub Actions,
# repository derekimp/battler, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
